name: Build Godot APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash .github/workflows/build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lovecraft-locker-re-apk
          path: '*.apk'
          if-no-files-found: warn
